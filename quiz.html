<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="新闻史复习">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1F3864">
  <meta name="format-detection" content="telephone=no">
  <title>题库练习 - 外国新闻事业史复习助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="quiz">
<div id="navbar-placeholder"></div>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">✍️ 题库练习</h1>
    <p class="page-subtitle">366道精选题库 · 单选/多选/名词解释/简答/论述</p>
  </div>

  <!-- 统计 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number">366</div>
      <div class="stat-label">题目总数</div>
    </div>
    <div class="stat-card accent">
      <div class="stat-number" id="done-count">0</div>
      <div class="stat-label">已做题目</div>
    </div>
    <div class="stat-card success">
      <div class="stat-number" id="correct-rate">0%</div>
      <div class="stat-label">正确率</div>
    </div>
    <div class="stat-card danger">
      <div class="stat-number" id="mistake-count">0</div>
      <div class="stat-label">错题数量</div>
    </div>
  </div>

  <!-- 题型选择 -->
  <div class="card">
    <div class="card-title">📝 选择题型</div>
    <div class="tabs" id="type-tabs">
      <button class="tab active" onclick="switchType('single')">单选题 (180)</button>
      <button class="tab" onclick="switchType('multiple')">多选题 (30)</button>
      <button class="tab" onclick="switchType('term')">名词解释 (61)</button>
      <button class="tab" onclick="switchType('short')">简答题 (65)</button>
      <button class="tab" onclick="switchType('essay')">论述题 (30)</button>
    </div>
  </div>

  <!-- 练习设置 -->
  <div class="card">
    <div class="card-title">⚙️ 练习设置</div>
    <div class="flex gap-16 flex-wrap">
      <div class="form-group" style="margin-bottom: 0; min-width: 150px;">
        <label class="form-label">练习模式</label>
        <select class="form-select" id="practice-mode">
          <option value="sequential">顺序练习</option>
          <option value="random">随机练习</option>
          <option value="wrong">错题重练</option>
          <option value="undone">未做题</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0; min-width: 150px;">
        <label class="form-label">每次题数</label>
        <select class="form-select" id="batch-size">
          <option value="10">10题</option>
          <option value="20" selected>20题</option>
          <option value="50">50题</option>
          <option value="999">全部</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label">&nbsp;</label>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="startPractice()">🚀 开始练习</button>
          <button class="btn btn-outline" onclick="resetTypeProgress()">重置本题型记录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 练习区域 -->
  <div id="practice-area" style="display: none;">
    <!-- 进度条 -->
    <div class="card">
      <div class="flex-between mb-8">
        <span id="progress-text" class="font-bold">第 1 / 20 题</span>
        <div class="flex gap-8">
          <span class="badge badge-success" id="correct-badge">正确: 0</span>
          <span class="badge badge-danger" id="wrong-badge">错误: 0</span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="practice-progress" style="width: 5%"></div></div>
    </div>

    <!-- 题目卡片 -->
    <div class="question-card" id="question-card">
      <div class="question-meta">
        <span class="badge badge-primary" id="q-type"></span>
        <span class="badge badge-info" id="q-id"></span>
      </div>
      <div class="question-text" id="q-text"></div>
      <div id="q-options"></div>
      <div id="q-answer-area" style="display: none;">
        <div class="answer-reveal show">
          <div class="answer-label">✅ 正确答案</div>
          <div id="q-correct-answer"></div>
        </div>
        <div class="mt-16" id="q-user-answer-area" style="display: none;">
          <div style="padding: 12px; background: #FFF3E0; border-left: 4px solid var(--accent); border-radius: 0 6px 6px 0;">
            <strong style="color: var(--accent);">你的回答：</strong>
            <span id="q-user-answer"></span>
          </div>
        </div>
      </div>
      <div class="mt-16 flex gap-8 flex-wrap" id="q-actions">
        <button class="btn btn-primary" onclick="submitAnswer()" id="submit-btn">提交答案</button>
        <button class="btn btn-outline" onclick="showAnswer()">查看答案</button>
        <button class="btn btn-success" onclick="nextQuestion()" id="next-btn" style="display: none;">下一题 →</button>
        <button class="btn btn-danger" onclick="addToMistakes()" id="mistake-btn" style="display: none;">❌ 加入错题本</button>
      </div>
    </div>

    <!-- 主观题输入 -->
    <div class="card" id="subjective-area" style="display: none;">
      <div class="form-group">
        <label class="form-label">你的回答（主观题请自行对照答案评分）</label>
        <textarea class="form-textarea" id="subjective-answer" placeholder="在此输入你的回答..."></textarea>
      </div>
    </div>
  </div>

  <!-- 完成总结 -->
  <div id="summary-area" style="display: none;">
    <div class="card text-center" style="padding: 40px;">
      <div style="font-size: 48px; margin-bottom: 16px;">🎉</div>
      <h2 style="color: var(--primary-dark); margin-bottom: 16px;">练习完成！</h2>
      <div class="stats-grid" style="max-width: 500px; margin: 0 auto 24px;">
        <div class="stat-card">
          <div class="stat-number" id="sum-total">0</div>
          <div class="stat-label">总题数</div>
        </div>
        <div class="stat-card success">
          <div class="stat-number" id="sum-correct">0</div>
          <div class="stat-label">正确</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-number" id="sum-wrong">0</div>
          <div class="stat-label">错误</div>
        </div>
        <div class="stat-card accent">
          <div class="stat-number" id="sum-rate">0%</div>
          <div class="stat-label">正确率</div>
        </div>
      </div>
      <div class="btn-group" style="justify-content: center;">
        <button class="btn btn-primary" onclick="startPractice()">🔄 再练一组</button>
        <a href="mistakes.html" class="btn btn-danger">❌ 查看错题本</a>
        <button class="btn btn-outline" onclick="backToSetup()">返回设置</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let currentType = 'single';
let questionList = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let userAnswers = [];
let isAnswered = false;

function updateStats() {
  const records = Store.getQuizRecords();
  const done = Object.keys(records).length;
  document.getElementById('done-count').textContent = done;

  // 正确率
  let correct = 0, total = 0;
  Object.values(records).forEach(r => {
    if (r.correct !== undefined) {
      total++;
      if (r.correct) correct++;
    }
  });
  document.getElementById('correct-rate').textContent = total > 0 ? Math.round(correct / total * 100) + '%' : '0%';
  document.getElementById('mistake-count').textContent = Store.getMistakes().length;
}

function switchType(type) {
  currentType = type;
  document.querySelectorAll('#type-tabs .tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  backToSetup();
}

function startPractice() {
  const mode = document.getElementById('practice-mode').value;
  const batchSize = parseInt(document.getElementById('batch-size').value);
  let allQuestions = APP_DATA.questions[currentType] || [];

  // 按模式筛选
  if (mode === 'random') {
    questionList = Utils.shuffle(allQuestions);
  } else if (mode === 'wrong') {
    const mistakes = Store.getMistakes().filter(m => m.type === currentType);
    const wrongIds = mistakes.map(m => m.id);
    questionList = allQuestions.filter(q => wrongIds.includes(q.id));
    if (questionList.length === 0) {
      Utils.showToast('该题型暂无错题', 'warning');
      return;
    }
  } else if (mode === 'undone') {
    const records = Store.getQuizRecords();
    questionList = allQuestions.filter(q => !records[currentType + '_' + q.id]);
    if (questionList.length === 0) {
      Utils.showToast('该题型已全部做完！', 'success');
      return;
    }
  } else {
    questionList = [...allQuestions];
  }

  // 限制数量
  if (questionList.length > batchSize) {
    questionList = questionList.slice(0, batchSize);
  }

  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  userAnswers = [];
  isAnswered = false;

  document.getElementById('practice-area').style.display = 'block';
  document.getElementById('summary-area').style.display = 'none';
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= questionList.length) {
    showSummary();
    return;
  }

  const q = questionList[currentIndex];
  isAnswered = false;

  document.getElementById('q-type').textContent = QUESTION_TYPE_MAP[currentType];
  document.getElementById('q-id').textContent = '第' + q.id + '题';
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('progress-text').textContent = `第 ${currentIndex + 1} / ${questionList.length} 题`;
  document.getElementById('practice-progress').style.width = ((currentIndex + 1) / questionList.length * 100) + '%';
  document.getElementById('correct-badge').textContent = '正确: ' + correctCount;
  document.getElementById('wrong-badge').textContent = '错误: ' + wrongCount;

  // 选项区域
  const optionsArea = document.getElementById('q-options');
  const subjectiveArea = document.getElementById('subjective-area');
  const answerArea = document.getElementById('q-answer-area');
  const submitBtn = document.getElementById('submit-btn');
  const nextBtn = document.getElementById('next-btn');
  const mistakeBtn = document.getElementById('mistake-btn');

  answerArea.style.display = 'none';
  nextBtn.style.display = 'none';
  mistakeBtn.style.display = 'none';
  submitBtn.style.display = 'inline-flex';

  if (currentType === 'single' || currentType === 'multiple') {
    subjectiveArea.style.display = 'none';
    optionsArea.style.display = 'block';
    let html = '<div class="options-list">';
    const labels = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, i) => {
      html += `
        <div class="option-item" data-index="${i}" onclick="selectOption(${i})">
          <span class="option-label">${labels[i]}.</span>
          <span>${Utils.escapeHtml(opt)}</span>
        </div>
      `;
    });
    html += '</div>';
    if (currentType === 'multiple') {
      html += '<div style="margin-top: 8px; font-size: 12px; color: var(--text-light);">💡 多选题，请选择所有正确选项</div>';
    }
    optionsArea.innerHTML = html;
  } else {
    optionsArea.style.display = 'none';
    subjectiveArea.style.display = 'block';
    document.getElementById('subjective-answer').value = '';
  }
}

let selectedOptions = [];

function selectOption(index) {
  if (isAnswered) return;
  if (currentType === 'single') {
    selectedOptions = [index];
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.toggle('selected', i === index);
    });
  } else {
    if (selectedOptions.includes(index)) {
      selectedOptions = selectedOptions.filter(i => i !== index);
    } else {
      selectedOptions.push(index);
    }
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.toggle('selected', selectedOptions.includes(i));
    });
  }
}

function submitAnswer() {
  const q = questionList[currentIndex];
  let userAnswer = '';
  let isCorrect = false;

  if (currentType === 'single' || currentType === 'multiple') {
    if (selectedOptions.length === 0) {
      Utils.showToast('请先选择答案', 'warning');
      return;
    }
    const labels = ['A', 'B', 'C', 'D'];
    userAnswer = selectedOptions.sort().map(i => labels[i]).join('');
    const correctAnswer = q.answer.replace(/[^A-D]/g, '').split('').sort().join('');
    isCorrect = userAnswer === correctAnswer;

    // 显示选项对错
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.remove('selected');
      const labels = ['A', 'B', 'C', 'D'];
      if (q.answer.includes(labels[i])) {
        el.classList.add('correct');
      }
      if (selectedOptions.includes(i) && !q.answer.includes(labels[i])) {
        el.classList.add('wrong');
      }
    });
  } else {
    userAnswer = document.getElementById('subjective-answer').value.trim();
    if (!userAnswer) {
      // 主观题未填写也可以查看答案
      isCorrect = null;
    } else {
      isCorrect = null; // 主观题不自动判分
    }
  }

  isAnswered = true;
  if (isCorrect === true) correctCount++;
  if (isCorrect === false) wrongCount++;

  // 保存记录
  Store.setQuizRecord(currentType, q.id, {
    answer: userAnswer,
    correct: isCorrect,
    time: new Date().toISOString()
  });

  // 显示答案
  document.getElementById('q-correct-answer').innerHTML = `
    <p style="font-size: 16px; font-weight: 700; color: var(--success);">${Utils.escapeHtml(q.answer)}</p>
    ${q.answer_detail ? `<p style="margin-top: 8px; color: #555;">${Utils.escapeHtml(q.answer_detail)}</p>` : ''}
  `;
  document.getElementById('q-answer-area').style.display = 'block';

  if (userAnswer) {
    document.getElementById('q-user-answer-area').style.display = 'block';
    document.getElementById('q-user-answer').textContent = userAnswer;
  }

  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'inline-flex';
  if (isCorrect === false || currentType !== 'single' && currentType !== 'multiple') {
    document.getElementById('mistake-btn').style.display = 'inline-flex';
  }

  document.getElementById('correct-badge').textContent = '正确: ' + correctCount;
  document.getElementById('wrong-badge').textContent = '错误: ' + wrongCount;

  updateStats();
}

function showAnswer() {
  const q = questionList[currentIndex];
  document.getElementById('q-correct-answer').innerHTML = `
    <p style="font-size: 16px; font-weight: 700; color: var(--success);">${Utils.escapeHtml(q.answer)}</p>
  `;
  document.getElementById('q-answer-area').style.display = 'block';
  document.getElementById('mistake-btn').style.display = 'inline-flex';
}

function addToMistakes() {
  const q = questionList[currentIndex];
  Store.addMistake({
    type: currentType,
    id: q.id,
    question: q.question,
    answer: q.answer,
    options: q.options || []
  });
  Utils.showToast('已加入错题本', 'success');
  document.getElementById('mistake-btn').style.display = 'none';
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  selectedOptions = [];
  showQuestion();
}

function showSummary() {
  document.getElementById('practice-area').style.display = 'none';
  document.getElementById('summary-area').style.display = 'block';
  document.getElementById('sum-total').textContent = questionList.length;
  document.getElementById('sum-correct').textContent = correctCount;
  document.getElementById('sum-wrong').textContent = wrongCount;
  const answered = correctCount + wrongCount;
  document.getElementById('sum-rate').textContent = answered > 0 ? Math.round(correctCount / answered * 100) + '%' : '-';
}

function backToSetup() {
  document.getElementById('practice-area').style.display = 'none';
  document.getElementById('summary-area').style.display = 'none';
}

function resetTypeProgress() {
  if (Utils.confirm(`确定要重置「${QUESTION_TYPE_MAP[currentType]}」的所有答题记录吗？`)) {
    const records = Store.getQuizRecords();
    Object.keys(records).forEach(key => {
      if (key.startsWith(currentType + '_')) {
        delete records[key];
      }
    });
    Store.set('quiz_records', records);
    updateStats();
    Utils.showToast('已重置本题型记录', 'success');
  }
}

document.addEventListener('DOMContentLoaded', updateStats);
</script>
</body>
</html>
